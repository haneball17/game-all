[workspace]
members = [
    "crates/game_core_protocols",
    "crates/game_core_common",
    "crates/game_injector_core",
    "crates/game_payload_core",
    "crates/game_control_core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
